[package]
name = "llm-gateway-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "llm-gateway のコマンドライン (serve / auth / status)"

[[bin]]
name = "llm-gateway"
path = "src/main.rs"

[dependencies]
llm-gateway = { path = "../llm-gateway", version = "0.75" }
llm-gateway-server = { path = "../llm-gateway-server", version = "0.75" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
# 台が webhook を配る client (`daemon run`)。usage 等を台に聞くのは運用系の口
# (`llm_gateway_server::socket::request`) で、reqwest は通らない。
reqwest = { workspace = true }
# service register / daemon add が焼き込むパスの安定化。
stable-which = { workspace = true }
# `auth keygen` の鍵の種。OS 由来の生成器。
rand = { workspace = true }
# `dump diff` が違う要素に添える hash。
sha2 = { workspace = true }

[dev-dependencies]
# 置き場の試験用実装が汎用層の Result を返すため。試験から socket に繋ぐ
# (`gateway_core::unix_socket`) のにも使う。
gateway-core = { path = "../gateway-core" }
# 試験で socket を置く・繋ぐ (path が sun_path を超えても届く)。
sockat = { workspace = true }
# 設定ファイルを試験ごとに使い捨てる (実運用の設定を触らせない)。
tempfile = { workspace = true }
# `auth jwks` の出力 (TOML の断片) を読んで確かめる。
toml = { workspace = true }
# `auth token` の出力のヘッダと claims (署名部を除く) を読んで確かめる。
base64 = { workspace = true }
