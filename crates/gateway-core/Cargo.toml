[package]
name = "gateway-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "gateway の汎用層: 認証の代行・保存・照合など、上流の種類を問わない部品"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
jiff = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
subtle = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "process", "io-util", "fs", "time"] }
reqwest = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true, optional = true }

[features]
# 利用側の crate の試験が使う部品 (`test_support`)。dev-dependencies からだけ有効にする。
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile = { workspace = true }
# 自分の試験 (tests/) でも `test_support` を使う。
gateway-core = { path = ".", features = ["test-support"] }
axum = { workspace = true }
