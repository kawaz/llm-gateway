[package]
name = "llm-gateway-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "llm-gateway の HTTP 層 (Anthropic Messages API を話す口)"

[lib]
name = "llm_gateway_server"
path = "src/lib.rs"

[dependencies]
llm-gateway = { path = "../llm-gateway", version = "0.32" }

axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
# 日次集計の置き場を試験ごとに分ける (実運用の state を触らせない)。
tempfile = { workspace = true }
# 記録が残ることを試験で確かめるための受け取り先。
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true }
