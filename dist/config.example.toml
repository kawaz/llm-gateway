# llm-gateway の設定。
#
# 置き場は $XDG_CONFIG_HOME/llm-gateway/config.toml (--config で変更可)。
#
# モデルの一覧は upstream に聞くので、ここには書かない。書くのは
# 「隠すもの」「特別扱いするもの」「短い名前」だけ。

# 待ち受け先だけが違う 2 台のように、ほとんど同じ設定を複数持つときは、
# 共通部分を別のファイルに置いて土台にできる (DR-0013):
#
#   extends = "config-shared.toml"   # 相対パスは、このファイルの隣から
#
# 土台の上に、このファイルに書いた分が重なる。表は鍵ごとに重なり
# (routes.bedrock.exclude だけ書けば provider / url は土台のまま)、
# 配列は丸ごと置き換わる (routing の並びは意味を持つので混ぜない)。

[server]
listen = "127.0.0.1:11300"
# この設定では待ち受けない (--config を省いて CLI を使うためのダミー)。
# listen の値は残るので、llm-gateway usage / stats はそこへ問い合わせる。
# disabled = true

[store]
type = "file"
# 省略時は $XDG_STATE_HOME/llm-gateway/credentials
# dir = "/path/to/credentials"

[stats]
# 使用量の日次集計の置き場。省略時は $XDG_STATE_HOME/llm-gateway/stats
# (llm-gateway stats / /llm-gateway/stats で見る)
# dir = "/path/to/stats"

[discovery]
# 一覧を取り直す間隔。新しいモデルが出たときに再起動せず拾える。
refresh_secs = 3600

# リクエストイベントを受け口へ送る。base_url を書かなければ無効。
# [webhook]
# base_url = "http://127.0.0.1:11400"
# 省略時は $XDG_DATA_HOME/ccmsg/webhook-llm-gateway.token
# token_file = "/path/to/webhook-llm-gateway.token"

# ---------------------------------------------------------------------------
# 認証情報
#
# キーが store 内のファイル名になる (claude-personal → claude-personal.json)。
# ここに宣言した分は、そのファイルに token または API key を置く必要がある。
# ---------------------------------------------------------------------------

[credentials.claude-personal]
type = "claude_oauth"

[routes.claude-personal]
provider = "anthropic"
credential = "claude-personal"

[credentials.claude-work]
type = "claude_oauth"

[routes.claude-work]
provider = "anthropic"
credential = "claude-work"

[credentials.chatgpt-personal]
type = "codex_oauth"

[routes.codex-personal]
provider = "openai"
credential = "chatgpt-personal"
# account 別 catalog を取得できないときの固定 fallback。
models = [
    "gpt-5.1",
    "gpt-5.1-codex-max",
    "gpt-5.1-codex-mini",
    "gpt-5.2",
    "gpt-5.2-codex",
    "gpt-5.3-codex",
    "gpt-5.3-codex-spark",
    "gpt-5.4",
]

# 特定のモデル専用にしたいアカウントは、他を exclude で塞ぐ。
# ここに書いた分は、上の [filter] に足して効く。
# exclude = ["claude-opus-*", "claude-sonnet-*"]

# Bedrock は fable 専用。Claude アカウントを消費しないのが目的なので、
# 他のモデルまで引き受けると意味がない。
#
# 名前の分裂も防げる: Bedrock は claude-haiku-4-5、公式は
# claude-haiku-4-5-20251001 と名乗るので、両方拾うと別モデルとして並ぶ。
[credentials.bedrock]
type = "bedrock_api_key"

[routes.bedrock]
provider = "anthropic"
credential = "bedrock"
url = "https://bedrock-mantle.us-east-1.api.aws/anthropic"
exclude = ["claude-opus-*", "claude-sonnet-*", "claude-haiku-*"]
# 受け付けない beta フラグは既定で落とす。顔ぶれを変えたいときだけ書く。
# deny_beta = ["oauth-2025-04-20", "prompt-caching-scope-2026-01-05"]

# 別の gateway へ丸ごと渡す。転送先が認証を持つので鍵は要らない。
# 一覧も聞けないので、扱うモデルをここに書く (これは許可リスト)。
[routes.other-gateway]
provider = "anthropic"
url = "http://127.0.0.1:8320"
models = ["gpt-5.6-sol", "gpt-5.6-terra", "gpt-5.6-luna"]

# ---------------------------------------------------------------------------
# 名前空間
#
# 何を見せるか・どこへ流すか・どう名乗らせるかは、ここから下に書く。
# クライアントの ANTHROPIC_BASE_URL は http://<host>/ns-<名前> になる。
#
# `default` は namespace を書かないパス (/v1/...) が解決される先で、
# 他と同じ書式。書かなければ /v1/... は 404 になる (DR-0006)。
#
# gateway 自身の口 (/llm-gateway/healthz など) は namespace の外にある。
# ---------------------------------------------------------------------------

[ns.default]
# この namespace を使うのに要るトークン。
#
# **書かないと誰も通れない。** 書き忘れが穴になるのを防ぐため、
# 未設定は「開放」ではなく「全拒否」として扱う (DR-0006)。
# クライアントは Authorization: Bearer <値> で名乗る。
auth_token = "ここに十分に長い乱数を書く"

# 公開しないモデル。
#
# upstream が返す一覧をそのまま出すと古い世代まで並ぶので、ここで隠す。
# この namespace の全 route に効く。
[ns.default.filter]
exclude = [
    "claude-3-*",
    "claude-opus-4*",
    "claude-sonnet-4*",
    "claude-haiku-3*",
]

# 振り分け。上から照合し、最初に当たった規則を使う。ここに書かないモデルは、
# discovery でそれを持っていた route へ流れる。

# fable は Bedrock 優先。落ちている間だけ OAuth へ回る。
[[ns.default.routing]]
models = ["claude-fable-*"]
routes = ["bedrock", "claude-work", "claude-personal"]

[[ns.default.routing]]
models = ["gpt-*"]
routes = ["codex-personal", "other-gateway"]

# 短い名前。
#
# 値はパターン。当たるもののうち created が一番新しいものへ向くので、
# 新しい世代が出れば自動で乗り換わる。ここに書いたものだけが有効
# (コード側に既定は無い)。
[ns.default.aliases]
fable = "claude-fable-*"
opus = "claude-opus-*"
sonnet = "claude-sonnet-*"
haiku = "claude-haiku-*"

# 面ごとに分けたいときは namespace を足す。使う route も絞れる。
# クライアント側は ANTHROPIC_BASE_URL=http://127.0.0.1:11300/ns-work。
#
# [ns.work]
# auth_token = "別の乱数"
# routes = ["claude-work"]
